name: CI Test Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & Verify (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Validate RubyGem Specification
        run: |
          gem build bilingual-jekyll-resume-theme.gemspec
          rm -f bilingual-jekyll-resume-theme-*.gem

      - name: Build Jekyll Site with Strict Checks
        run: |
          bundle exec jekyll build --source demo --destination _site --strict_front_matter --trace

      - name: Verify Built HTML (dead links, anchors, images, hreflang)
        run: |
          bundle exec rake proof[_site,demo/_config.yml]

      - name: Static Analysis (RuboCop)
        run: |
          bundle exec rake rubocop

      - name: Validate Resume Data Schemas & Parity
        run: |
          chmod +x bin/validate-resume
          ./bin/validate-resume demo/_data --fail-on-warnings
          bundle exec rake validate[demo/_data]

      - name: Check Templates Against Data Keys
        run: |
          chmod +x bin/check-data-keys
          ./bin/check-data-keys demo/_data
          bundle exec rake check_data_keys[demo/_data]

      - name: Run Test Suite
        run: |
          bundle exec rake test
