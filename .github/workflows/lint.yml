name: YAML Schema & Data Linter

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-data:
    name: Lint Resume Schemas & Parity
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Validate Resume Data with CLI Linter
        run: |
          chmod +x bin/validate-resume
          ./bin/validate-resume demo/_data --fail-on-warnings

      - name: Run Rake Validation Task
        run: |
          bundle exec rake validate[demo/_data]

      - name: Check Templates Against Data Keys
        run: |
          chmod +x bin/check-data-keys
          ./bin/check-data-keys demo/_data

      - name: Run Rake Check-Data-Keys Task
        run: |
          bundle exec rake check_data_keys[demo/_data]

      - name: Validate RubyGem Specification & Executables
        run: |
          gem build bilingual-jekyll-resume-theme.gemspec
          gem spec bilingual-jekyll-resume-theme-*.gem executables | grep -q "validate-resume"
          # check-data-keys is a dev/CI-only tool and must never ship as a gem executable
          gem spec bilingual-jekyll-resume-theme-*.gem executables | grep -qv "check-data-keys"
          ! gem spec bilingual-jekyll-resume-theme-*.gem files | grep -q "docs/COMPLETED_AUDIT.md"
          rm -f bilingual-jekyll-resume-theme-*.gem

  lint-ruby:
    name: Lint Ruby (RuboCop)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Run RuboCop
        run: |
          bundle exec rake rubocop
