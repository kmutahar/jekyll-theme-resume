name: Publish Gem & Create Release

# This workflow automates the process of building and pushing your gem to RubyGems.org,
# as well as creating a GitHub Release with the latest changelog notes and attaching the .gem file.
on:
  # Trigger 1: Automatically runs whenever you push a tag starting with 'v' (e.g., v0.8.0, v1.0.0)
  push:
    tags:
      - 'v*'

# Grant write permissions to repository contents so GitHub Actions can create Releases
permissions:
  contents: write

jobs:
  build:
    name: Build, Publish and Release
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository code. 
    # Third-party actions are pinned to full commit SHAs (Dependabot keeps them current).
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # 2. Set up the Ruby environment.
    # setup-ruby is the official way to manage Ruby versions in GitHub Actions.
    - name: Set up Ruby
      uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      with:
        ruby-version: '3.4'
        bundler-cache: true # Automatically runs 'bundle install' and caches gems

    # 3. Authenticate and Publish to RubyGems.org.
    # Since we are in a headless CI environment, we manually create the credentials file
    # that the 'gem' command-line tool expects to find.
    - name: Publish to RubyGems
      run: |
        # Create the .gem directory in the runner's home folder
        mkdir -p $HOME/.gem
        
        # Create a credentials file and set strict permissions (required by RubyGems)
        touch $HOME/.gem/credentials
        chmod 0600 $HOME/.gem/credentials
        
        # Write the API key into the credentials file in YAML format
        printf -- "---\n:rubygems_api_key: ${RUBYGEMS_API_KEY}\n" > $HOME/.gem/credentials
        
        # Build the gem based on your .gemspec file
        gem build *.gemspec
        
        # Push the generated .gem file to RubyGems.org
        # Using a wildcard (*) ensures it grabs the versioned file we just built
        gem push *.gem
      env:
        # Pulls the secret stored in GitHub Settings > Secrets and variables > Actions
        RUBYGEMS_API_KEY: "${{ secrets.RUBYGEMS_API_KEY }}"

    # 4. Extract the top release section directly from CHANGELOG.md.
    # Uses awk to grab the latest release notes section (from the first '## [' header down to the second)
    # ensuring 100% exact parity with your committed CHANGELOG.md file.
    - name: Extract Release Notes from CHANGELOG.md
      run: |
        awk '/^## \[/{if (count++) exit} count' CHANGELOG.md > RELEASE_NOTES.md

    # 5. Automatically create a GitHub Release for the pushed tag (e.g. v0.8.0),
    # setting the release body description from RELEASE_NOTES.md and attaching the built .gem asset.
    - name: Create GitHub Release & Upload Gem Artifact
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        body_path: RELEASE_NOTES.md
        files: "*.gem"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}