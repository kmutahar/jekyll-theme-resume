# Shared network list for _includes/social-links.html and
# _includes/print-social-links.html: one entry per site.social_links.<key>
# platform. Order here is the icon/print display order. To add a platform,
# add its SVG to _includes/vendors/svg-icons/ and an entry here.
#
# icon: filename (without .svg) under _includes/vendors/svg-icons/
# itemprop: schema.org microdata value social-links.html sets on the <a>
# label: English fallback for the icon's aria-label/title; each locale's
#        ui.social_labels.<key> wins when present (print labels use it too)
- key: behance
  icon: behance
  itemprop: sameAs
  label: Behance

- key: devto
  icon: dev
  itemprop: url
  label: Dev.to

- key: discord
  icon: discord
  itemprop: url
  label: Discord

- key: dribbble
  icon: dribbble-symbol
  itemprop: sameAs
  label: Dribbble

- key: email
  icon: envelope
  itemprop: email
  label: Email

- key: facebook
  icon: facebook
  itemprop: sameAs
  label: Facebook

- key: flickr
  icon: flickr
  itemprop: url
  label: Flickr

- key: github
