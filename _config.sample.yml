# ==============================================================================
# MULTILINGUAL JEKYLL RESUME THEME - MASTER SAMPLE CONFIGURATION
# ==============================================================================
# This configuration file contains all supported settings for the theme.
# Copy this file to your site's root as `_config.yml` and customize it.
# Working defaults are uncommented. Optional and advanced overrides are commented.
# ==============================================================================

# ==============================================================================
# 1. SITE IDENTITY & LOCALIZATION
# ==============================================================================
theme: jekyll-theme-resume
title: "Your Full Name"
description: >- # Ignore newlines until next key; used for SEO meta descriptions
  A brief description of your site or professional tagline.
url: "https://your-domain.com" # Full site URL (protocol + host), e.g. https://example.com
baseurl: ""                    # Subpath if hosted in a subdirectory (e.g., /resume); keep "" if at root
timezone: UTC                  # Timezone for date rendering (e.g., UTC, America/New_York, Asia/Riyadh)

# Language comes from page.lang or default_lang (Section 6.5).
# Direction comes from _data/locales/<lang>.yml; no site-wide lang/dir keys are used.

# ==============================================================================
# 2. FAVICONS & WEB APP MANIFEST (Optional - defaults to theme bundled assets)
# ==============================================================================
# Override these with relative paths in your site repository if you provide custom icons:
# favicon: "assets/favicon/resume/favicon.ico"
# apple_touch_icon: "assets/favicon/resume/apple-touch-icon.png"
# favicon_32: "assets/favicon/resume/favicon-32x32.png"
# favicon_16: "assets/favicon/resume/favicon-16x16.png"

# ==============================================================================
# 3. PERSONAL INFORMATION & TITLES (Required)
# ==============================================================================
# Name, job title, address, and avatar alt text are per-language in Section 6.5
# (languages.<lang>.name / .resume_title / .address / .avatar_alt). There is no
# site-wide name or title key in v1.0.0.

# ==============================================================================
# 4. PROFILE PICTURE / AVATAR SETTINGS
# ==============================================================================
# Master toggle for displaying profile picture in the resume header
resume_avatar: true

# Custom image source (relative path like 'assets/images/me.jpg' or full URL 'https://example.com/avatar.jpg')
# Defaults to theme default '/assets/images/Profile-min.jpg' if not specified
# avatar_url: "assets/images/Profile-min.jpg"

# Accessible alt text falls back to languages.<lang>.avatar_alt (Section 6.5),
# then languages.<lang>.name, then locale.ui.photo_alt if neither is set.

# Clickable avatar link destination and behavior
# Set to false to render as a plain standalone <img> without an <a> wrapper
# avatar_link: "/"                   # Destination URL (default: "/")
# avatar_link_target: "_self"        # Target attribute: "_self" (recommended) or "_blank"

# ==============================================================================
# 5. CONTACT INFORMATION (Required: at least email)
# ==============================================================================
contact_info:
  email: "sherlock@example.com"      # Required for contact CTA button
  phone: "+44 20 7946 0958"          # Optional
  # Address is per-language: languages.<lang>.address (Section 6.5)
  # dob: 1990-01-01                  # Optional Date of Birth (YYYY-MM-DD)
  #
  # Advanced: alternate contact info used when enable_live: true
  # email_live: "live@example.com"
  # phone_live: "+1 555 000 0000"

# ==============================================================================
# 6. SOCIAL MEDIA LINKS (Optional - only add platforms you actively use)
# ==============================================================================
# Supported platforms render interactive SVG icons on page and text in print.
# `email` renders a native mailto: link with an accessible label (Feature 1.7):
social_links:
  email: "you@example.com"
  github: https://github.com/yourusername
  linkedin: https://www.linkedin.com/in/yourhandle/
  twitter: https://twitter.com/yourhandle
  # telegram: https://t.me/yourhandle
  # medium: https://medium.com/@yourhandle
  # website: https://yourwebsite.com
  # whatsapp: https://wa.me/1234567890
  # instagram: https://instagram.com/yourhandle
  # facebook: https://facebook.com/yourhandle
  # youtube: https://youtube.com/@yourhandle
  # devto: https://dev.to/yourhandle
  # dribbble: https://dribbble.com/yourhandle
  # flickr: https://flickr.com/people/yourhandle
  # pinterest: https://pinterest.com/yourhandle
  # discord: https://discord.gg/yourinvite
  # behance: https://behance.net/yourhandle
  # mastodon: https://mastodon.social/@yourhandle # Emits <link rel="me"> in default layout

# ==============================================================================
# 6.5 LANGUAGES (v1.0.0 locale-agnostic `layout: resume`)
# ==============================================================================
# Direction and fonts come from _data/locales/<lang>.yml, never from here.
# Each entry's data_path/url/header_intro/name/resume_title/address/avatar_alt
# feed the single `_layouts/resume.html` layout for that language.
#
# Two more keys are optional and consumed only by `layout: profile` (the
# bio-link homepage, not the CV):
#   about      - Free-form bio rendered under the name. Markdown, raw HTML, or
#                plain text all work (piped through markdownify).
#   name_html  - Override for the <h1> name markup. Without it, the layout
#                auto-bolds the last space-separated word (the common
#                single-surname case). Set this for compound surnames,
#                particles ("van der Berg"), or hyphenated names where that
#                guess would bold the wrong part.
languages:
  en:
    data_path: en
    url: /en/cv/
    header_intro: true
    name: "Your Full Name"
    resume_title: "Your Job Title"
    address: "Your City, Your Country"
    avatar_alt: "Your profile photo"
    # about: >-
    #   A brief bio for your homepage. Supports **Markdown**, <a href="https://example.com">raw HTML</a>, or plain text.
    # name_html: "Your <b>Full Name</b>"
  ar:
    data_path: ar
    url: /ar/cv/
    header_intro: true
    name: "اسمك الكامل"
    resume_title: "مسماك الوظيفي"
    address: "مدينتك، بلدك"
    avatar_alt: "صورتك الشخصية"
    # about: >-
    #   نبذة مختصرة لصفحتك الرئيسية.
    # name_html: "اسمك <b>الكامل</b>"
  es:
    data_path: es
    url: /es/cv/
    header_intro: true
    name: "Tu Nombre Completo"
    resume_title: "Tu Cargo"
    address: "Tu Ciudad, Tu País"
    avatar_alt: "Tu foto de perfil"
    # about: >-
    #   Una breve biografía para tu página principal.
    # name_html: "Tu <b>Nombre Completo</b>"
  fr:
    data_path: fr
    url: /fr/cv/
    header_intro: true
    name: "Votre Nom Complet"
    resume_title: "Votre Poste"
    address: "Votre Ville, Votre Pays"
    avatar_alt: "Votre photo de profil"
    # about: >-
    #   Une brève biographie pour votre page d'accueil.
    # name_html: "Votre <b>Nom Complet</b>"
  de:
    data_path: de
    url: /de/cv/
    header_intro: true
    name: "Ihr Vollständiger Name"
    resume_title: "Ihre Berufsbezeichnung"
    address: "Ihre Stadt, Ihr Land"
    avatar_alt: "Ihr Profilbild"
    # about: >-
    #   Eine kurze Biografie für Ihre Startseite.
    # name_html: "Ihr <b>Vollständiger Name</b>"
  ur:
    data_path: ur
    url: /ur/cv/
    header_intro: true
    name: "آپ کا پورا نام"
    resume_title: "آپ کا عہدہ"
    address: "آپ کا شہر، آپ کا ملک"
    avatar_alt: "آپ کی پروفائل تصویر"
    # about: >-
    #   آپ کے ہوم پیج کے لیے ایک مختصر تعارف۔
    # name_html: "آپ کا <b>پورا نام</b>"

default_lang: en                     # Drives hreflang x-default and fallback lookups

# A languages.<lang> entry with no hand-authored CV/profile page gets one auto-generated
# (CV at languages.<lang>.url, profile at "/" for default_lang or "/<lang>/" otherwise).
# Set false to require every language to have its own hand-authored page. Override per
# language with languages.<lang>.auto_generate_pages: true/false.
resume_auto_generate_pages: true

# ==============================================================================
# 7. RESUME DISPLAY & BEHAVIOR CONTROLS
# ==============================================================================
# Language dropdown (fixed top-left, lists every other configured language)
resume_language_switcher: true       # Toggle floating language switcher (default: true)

# Header display toggles
display_header_contact_info: true    # Show contact info row in header
# Per-language header intro toggle: languages.<lang>.header_intro (Section 6.5)

# Job search status button in header:
# true  -> Display contact button linked to contact_info.email
# false -> Display "I'm not looking for work" / "لست متاحاً للعمل حالياً" status pill
# (omit or remove key entirely to display nothing)
resume_looking_for_work: true

# Content behavior
enable_summary: false                # Show detailed summary/description for roles & courses
enable_live: false                   # Use email_live & phone_live instead of standard contact info
resume_print_social_links: true      # Render text list of social links in physical and PDF prints

# Build-time resume data validation (warns by default; never fails the build
# unless validate_resume_strict is also true)
validate_resume: true
validate_resume_strict: false

# ==============================================================================
# 8. RESUME SECTIONS TOGGLE & RENDER ORDER
# ==============================================================================
# Section master toggles (true to render, false to hide):
resume_section:
  associations: true
  certifications: true
  courses: true
  education: true
  experience: true
  interests: false
  lang_header: true                  # Show compact language chips in header instead of full section
  languages: false
  links: false
  publications: false
  references: false
  projects: true
  recognitions: false
  skills: false
  volunteering: true

# Order in which resume sections appear on the page:
# Only sections set to 'true' in resume_section above will actually render.
resume_section_order:
  - experience
  - education
  - certifications
  - courses
  - volunteering
  - projects
  - associations
  - skills
  - recognitions
  - languages
  - interests
  - links
  - publications
  - references

# ==============================================================================
# 9. STYLING, FONTS & DARK MODE
# ==============================================================================
# Dark Mode Configuration:
# - "auto" (default): system-preference CSS, no toggle button; shared preference script still runs
# - "enabled" or true: Renders interactive floating toggle button with localStorage persistence
# - false or "disabled": hides the toggle; does not force the page into light mode
dark_mode: auto

# Visual theme variant (default: "default")
resume_theme: default

# To use a self-hosted or alternate CDN font for a locale, override that locale's
# font_url in your site's own _data/locales/<lang>.yml (see "Overriding Theme
# Locales" in docs/explanation/multilingual-and-rtl-design.md) instead of a site-wide config key.

# Disable font stylesheet loading in the resume layout (including a custom locale font_url)
# disable_google_fonts: true

# Optional authors metadata
authors: []

# ==============================================================================
# 10. ANALYTICS (Optional - configure at most ONE provider)
# ==============================================================================
analytics:
  # Google Tag Manager (recommended - injects head script and noscript body iframe):
  # gtm: "GTM-XXXXXXX"

  # Google Analytics 4 (injects async gtag.js with measurement ID):
  # gtag: "G-XXXXXXXXXX"

# ==============================================================================
# 11. JEKYLL BUILD SETTINGS & PLUGINS
# ==============================================================================
# Required plugins (bundled as theme runtime dependencies)
plugins:
  # Belt-and-suspenders: Jekyll auto-requires gems listed here (site.gems) regardless
  # of Bundler group, guarding against a Gemfile that forgets to put the theme gem in
  # the `:jekyll_plugins` group — without that, the build-time resume validator and
  # page generators silently never run.
  - jekyll-theme-resume
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# File processing rules
include:
  - _redirects
  - .well-known/
  - _pages/
  - _posts/

exclude:
  - scratch.md
  - README.md
  - Gemfile*
  - vendor/
  - node_modules/
  - "*.gemspec"
  - netlify.toml
  - vercel.json
  - WARP.md
  - scripts/

# Front matter defaults (optional)
defaults: []

# JSON Resume exports: /<lang>/resume.json and a default-language /resume.json.
# Details and field mappings: docs/reference/json-resume-fields.md in the theme repository.
json_resume:
  enabled: true
  root_export: true
  languages: [] # Empty/missing: all configured languages
  privacy:
    export_contact_info: true # False removes email, phone, location, WhatsApp from JSON
# JSON-LD (Schema.org ProfilePage + Person) in each CV page's <head>.
# Independent of json_resume.enabled; honors json_resume.privacy.export_contact_info.
# Details: docs/reference/json-ld-fields.md in the theme repository.
json_ld:
  enabled: true
# Optional; social_links values remain URL strings.
# social_usernames:
#   github: octocat
